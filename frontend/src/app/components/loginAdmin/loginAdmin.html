<div class="card login-kartica">
    <h2>Administratorska prijava</h2>
    <form (ngSubmit)="prijava()">
        <label>Korisničko ime</label>
        <input type="text" name="korisnickoIme" [(ngModel)]="korisnickoIme" required />
        <label>Lozinka</label>
        <input type="password" name="lozinka" [(ngModel)]="lozinka" required />
        <div class="mt-2">
            <button type="submit">Prijavi se</button>
        </div>
    </form>

    @if (poruka) {
        <div class="poruka poruka-greska">{{ poruka }}</div>
    }
</div>
